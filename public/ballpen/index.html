<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="볼펜 히어로 — 가온연구소 제작 낙서 격투 게임">
<title>볼펜 히어로</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 레이아웃: 어두운 책상 위에 놓인 공책 한 장(캔버스) + 모바일 터치 버튼 */
:root{
  --desk:#262c38; --paper:#f6f8f3; --ink:#1d3fa8; --red:#c8372d; --pencil:#4a4d55;
  --hand:"Gaegu","Nanum Pen Script",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--paper);margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--hand)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));box-sizing:border-box}
canvas{display:block;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-.35deg);max-width:100%}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.cl{display:flex;gap:10px;pointer-events:auto}
.cl.r{display:grid;grid-template-columns:repeat(3,auto);gap:8px;align-items:end}
#pad button{font-family:var(--hand);font-weight:700;font-size:19px;color:var(--ink);width:64px;height:64px;border-radius:50%;
  border:2.5px solid var(--ink);background:rgba(246,248,243,.78);touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#pad button.sm{width:54px;height:54px;font-size:16px}
#pad button.big{width:80px;height:80px;font-size:23px}
#pad button.sp{color:var(--red);border-color:var(--red)}
#pad button.on{background:var(--ink);color:var(--paper)}
#pad button.sp.on{background:var(--red)}
#pad button:focus-visible{outline:3px solid #ffd34d}
#rot{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:18px;color:#c9d3e6;display:none}
@media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
[hidden]{display:none!important}
</style>

</head>
<body>
<div id="stage"><canvas id="game" aria-label="볼펜 히어로 게임 화면"></canvas></div>
<div id="rot">휴대폰을 가로로 돌리면 더 크게 즐길 수 있어요</div>
<div id="pad" hidden>
  <div class="cl"><button data-a="L" aria-label="왼쪽">◀</button><button data-a="R" aria-label="오른쪽">▶</button></div>
  <div class="cl r">
    <button data-a="D" class="sm">대시</button><button data-a="S" class="sm sp">필살</button><button data-a="H" class="sm">기술</button>
    <button data-a="U">점프</button><button data-a="K">킥</button><button data-a="P" class="big">펀치</button>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=960,H=540,GY=455,DPR=Math.min(2,window.devicePixelRatio||1),G=1900;
cv.width=W*DPR;cv.height=H*DPR;
const mk=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;return c};
const paperCv=mk(),stainCv=mk(),tearCv=mk();
const sctx=stainCv.getContext('2d');sctx.setTransform(DPR,0,0,DPR,0,0);
const INK='#1d3fa8',RED='#c8372d',PEN='#4a4d55',PAPER='#f6f8f3',FLAME='#e0752d',PURP='#6b3fb0',YEL='#ffd84d',DESK='#262c38';
const FONT='"Gaegu","Nanum Pen Script",cursive';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage'),pad=document.getElementById('pad');
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
pad.hidden=!TOUCH;
function fit(){const r=stage.getBoundingClientRect(),cs=getComputedStyle(stage);
  const aw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const s=Math.max(.1,Math.min(aw/W,ah/H));cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

/* ---------- 손그림 도구 ---------- */
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
const jit=a=>(rnd()-.5)*2*a,R=Math.random,pick=a=>a[Math.floor(R()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function inkLine(x1,y1,x2,y2,w=3,col=INK,j=1.4){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x1+jit(j*.5),y1+jit(j*.5));ctx.quadraticCurveTo((x1+x2)/2+jit(j),(y1+y2)/2+jit(j),x2+jit(j*.5),y2+jit(j*.5));ctx.stroke();}
function inkCircle(cx,cy,r,w,col,fill){ctx.beginPath();const n=16,st=rnd()*6.28;
  for(let i=0;i<=n+2;i++){const a=st+i/n*6.283,rr=r+jit(r*.07+.5);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.stroke();}
function inkRect(x,y,w,h,lw,col){inkLine(x,y,x+w,y,lw,col);inkLine(x+w,y,x+w,y+h,lw,col);inkLine(x+w,y+h,x,y+h,lw,col);inkLine(x,y+h,x,y,lw,col);}
function txt(s,x,y,size,col,align='center',weight=700){ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function star(x,y,r,fill,col,n=10){ctx.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*6.283,rr=i%2?r*.42:r*(0.85+rnd()*.3);const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke()}

/* ---------- 공책 종이 ---------- */
function drawPaper(){const p=paperCv.getContext('2d');p.setTransform(DPR,0,0,DPR,0,0);
  p.fillStyle=PAPER;p.fillRect(0,0,W,H);
  for(let i=0;i<1400;i++){p.fillStyle=`rgba(60,70,90,${Math.random()*.05})`;p.fillRect(Math.random()*W,Math.random()*H,1,1)}
  p.strokeStyle='#bcd2ea';p.lineWidth=1;for(let y=58;y<H;y+=28){p.beginPath();p.moveTo(0,y+.5);p.lineTo(W,y+.5);p.stroke()}
  p.strokeStyle='#e6a2a0';p.lineWidth=1.6;p.beginPath();p.moveTo(74,0);p.lineTo(74,H);p.stroke();
  for(const y of [92,270,448]){p.fillStyle=DESK;p.beginPath();p.arc(32,y,11,0,7);p.fill()}
  p.strokeStyle='rgba(150,100,50,.10)';p.lineWidth=7;p.beginPath();p.arc(832,150,44,0,6.28);p.stroke();
  p.strokeStyle='rgba(74,77,85,.2)';p.lineWidth=1.4;p.lineJoin='round';
  let x=110;p.beginPath();p.moveTo(x,GY);
  while(x<930){const t=Math.random();const w=40+Math.random()*60,h=40+Math.random()*70;
    if(t<.4){p.lineTo(x,GY-h);for(let k=0;k<3;k++){p.lineTo(x+w/3*(k+.6),GY-h-14);p.lineTo(x+w/3*(k+1),GY-h)}}
    else if(t<.7){p.lineTo(x,GY-h);p.lineTo(x+w*.3,GY-h);p.lineTo(x+w*.3,GY-h-50);p.lineTo(x+w*.45,GY-h-50);p.lineTo(x+w*.45,GY-h);p.lineTo(x+w,GY-h);
      for(let k=0;k<3;k++){p.moveTo(x+w*.37+k*6+4+k*2,GY-h-60-k*12);p.arc(x+w*.37+k*6,GY-h-60-k*12,4+k*2,0,6.28)}p.moveTo(x+w,GY-h)}
    else{p.lineTo(x,GY-h*.6);p.lineTo(x+w,GY-h*.6);const cx=x+w/2,cy=GY-h*.6-22;p.moveTo(cx+14,cy);p.arc(cx,cy,14,0,6.28);
      for(let k=0;k<8;k++){const a=k/8*6.28;p.moveTo(cx+Math.cos(a)*14,cy+Math.sin(a)*14);p.lineTo(cx+Math.cos(a)*19,cy+Math.sin(a)*19)}p.moveTo(x+w,GY-h*.6)}
    p.lineTo(x+w,GY);x+=w+10;p.moveTo(x,GY)}
  p.stroke();}

/* ---------- 입력 ---------- */
const keys=new Set(),pressed=new Set();
const KEYMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',Space:'U',KeyJ:'P',KeyZ:'P',KeyK:'K',KeyX:'K',KeyL:'S',KeyC:'S',ShiftLeft:'D',ShiftRight:'D',KeyV:'D',Enter:'E',KeyM:'M',KeyH:'H',Escape:'H'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(!a)return;e.preventDefault();if(!keys.has(a))pressed.add(a);keys.add(a);initAudio()});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)keys.delete(a)});
addEventListener('blur',()=>keys.clear());
pad.querySelectorAll('button').forEach(b=>{const a=b.dataset.a;
  const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}if(!keys.has(a))pressed.add(a);keys.add(a);b.classList.add('on');initAudio();if(state!=='play')pressed.add('E');if(navigator.vibrate&&a==='P')try{navigator.vibrate(8)}catch(_){}};
  const up=()=>{keys.delete(a);b.classList.remove('on')};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});
cv.addEventListener('pointerdown',()=>{initAudio();if(state!=='play')pressed.add('E');else if(paused)paused=false});

/* ---------- 소리 ---------- */
let AC=null,noiseBuf=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function boom(freq,dur,vol,low){const now=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();
  s.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur);s.start(now);s.stop(now+dur);
  if(low){const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.setValueAtTime(low,now);o.frequency.exponentialRampToValueAtTime(30,now+dur);og.gain.setValueAtTime(vol*1.2,now);og.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(og);og.connect(AC.destination);o.start(now);o.stop(now+dur)}}
function whoosh(freq,dur,vol){const now=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(freq*.5,now);f.frequency.exponentialRampToValueAtTime(freq*2,now+dur);const g=AC.createGain();s.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(vol,now+dur*.3);g.gain.exponentialRampToValueAtTime(.001,now+dur);s.start(now);s.stop(now+dur)}
function tone(a,b,dur,type,vol){const now=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(a,now);o.frequency.exponentialRampToValueAtTime(b,now+dur);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+dur+.02);o.start(now);o.stop(now+dur+.03)}
function sfx(t){if(!AC||muted)return;try{switch(t){
  case 'hit':boom(tf>0?1200:2200,.1,tf>0?.65:.45,tf>0?90:160);break;case 'big':boom(900,.22,.6,110);break;case 'kill':boom(700,.3,.7,90);tone(900,200,.15,'square',.05);break;
  case 'wall':boom(500,.35,.8,70);break;case 'boom':boom(400,.7,.9,55);break;case 'glass':boom(5000,.4,.35);tone(2400,3200,.2,'triangle',.08);break;
  case 'wood':boom(1200,.25,.55,140);break;case 'hurt':boom(1100,.14,.4,220);break;case 'tear':{const now=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g=AC.createGain();s.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,now);g.gain.exponentialRampToValueAtTime(.001,now+.45);s.start(now);s.stop(now+.45);break}
  case 'swing':whoosh(tf>0?700:1400,.13,tf>0?.4:.25);break;
  case 'charge':{const now=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(90,now);o.frequency.exponentialRampToValueAtTime(900,now+1.3);l.frequency.value=18;lg.gain.value=30;l.connect(lg);lg.connect(o.frequency);f.type='lowpass';f.frequency.setValueAtTime(400,now);f.frequency.exponentialRampToValueAtTime(3200,now+1.3);o.connect(f);f.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.2,now+1.1);g.gain.exponentialRampToValueAtTime(.001,now+1.45);o.start(now);l.start(now);o.stop(now+1.5);l.stop(now+1.5);boom(220,1.4,.5,50);break}
  case 'powerup':boom(600,.9,.9,60);tone(300,1800,.35,'square',.08);break;
  case 'beamc':tone(200,1500,.45,'sawtooth',.09);whoosh(800,.45,.3);break;
  case 'beam':boom(1500,1.1,.65,70);tone(140,60,1,'sawtooth',.12);break;
  case 'teleport':tone(1800,250,.12,'sine',.2);whoosh(3000,.1,.25);break;case 'jump':tone(260,620,.1,'sine',.14);break;case 'pick':tone(600,1300,.12,'square',.06);break;case 'block':tone(1500,900,.08,'square',.09);break;}}catch(e){}}

/* ---------- 게임 상태 ---------- */
let state='title',page=1,score=0,best=0,ink=100,special=0,combo=0,comboT=0,comboPop=0,nextSlow=25,slowT=0,hitstop=0,shake=0,clearT=0,overT=0,waveDelay=0,rt=0,titleT=0;
let zoom=0,zx=W/2,zy=H/2,impactT=0,tf=0,tfIntro=0,beam=null,beamCD=0,paused=false;
try{best=+localStorage.getItem('ballpen-hero-best')||0}catch(e){}
let enemies=[],props=[],pickups=[],projs=[],parts=[],texts=[],banner=null,tear=null,waves=[],waveIdx=0,spawnQ=[],spawnT=0;
let counts={punch:0,kick:0,weapon:0};
const P={};
const ONO=['퍽!','쾅!','팍!','뻥!','콰직!','빡!','우당탕!'];
const WNAME={pipe:'쇠파이프',sword:'대검',hammer:'거대 해머',bazooka:'바주카',ink:'잉크병',orb:'분노 구슬'};
const ET={
  grunt:{hp:28,spd:110,dmg:5,range:42,cd:1.5,wind:.55,col:'#454850',sc:1,pts:100},
  runner:{hp:18,spd:200,dmg:4,range:38,cd:1.1,wind:.4,col:'#5a5562',sc:.9,pts:120},
  heavy:{hp:75,spd:62,dmg:9,range:58,cd:2,wind:.8,col:'#33363d',sc:1.3,pts:300},
  thrower:{hp:20,spd:95,dmg:4,range:330,cd:2.6,wind:.6,col:'#52606c',sc:1,pts:150,ranged:true},
  boss:{hp:320,spd:95,dmg:10,range:110,col:RED,sc:2,pts:3000}
};

function resetPlayer(){Object.assign(P,{x:200,y:GY,vx:0,vy:0,face:1,ground:true,act:null,actT:0,actDur:0,chain:0,chainT:0,inv:0,hurtT:0,dashCD:0,weapon:null,ammo:0,runT:0,hitSet:new Set(),torching:false,tick:0,thrown:false,run:0,lastTap:-9,lastDir:0,sj:false,airHits:0,flipT:0,diveH:GY,lastCall:-9})}
function newGame(){page=1;score=0;ink=100;special=0;combo=0;comboT=0;nextSlow=25;slowT=0;tf=0;tfIntro=0;beam=null;beamCD=0;paused=false;resetPlayer();setupPage();state='play'}
function addProps(n){for(let i=0;i<n;i++){let x,tries=0;do{x=260+R()*620;tries++}while(tries<20&&(props.some(p=>Math.abs(p.x-x)<70)||Math.abs(x-P.x)<90));
  const r=R(),kind=r<.42?'box':r<.7?'drum':'glass';props.push({kind,x,y:GY,hp:{box:22,drum:12,glass:6}[kind],hitT:0,dead:false})}}
function setupPage(){enemies=[];projs=[];pickups=[];parts=[];texts=[];props=[];sctx.clearRect(0,0,W,H);counts={punch:0,kick:0,weapon:0};
  P.x=200;P.y=GY;P.vx=0;P.vy=0;P.act=null;addProps(4);
  const k=x=>x+Math.floor((page-1)*.7);
  waves=[[['grunt',k(3)]],[['grunt',k(2)],['runner',k(2)]],[['thrower',k(1)],['grunt',k(2)],['heavy',page>1?1:0]],[['runner',k(2)],['heavy',1],['thrower',k(1)]],'boss'];
  waveIdx=0;startWave();clearT=0;}
function startWave(){const w=waves[waveIdx];spawnQ=[];if(waveIdx>0&&props.length<4)addProps(4-props.length);
  if(w==='boss'){spawnQ=['boss'];showBanner('보스 등장!','AI 낙서괴물 · 당신의 공격 버릇을 학습합니다',2.2)}
  else{for(const [t,c] of w)for(let i=0;i<c;i++)spawnQ.push(t);spawnQ.sort(()=>R()-.5);showBanner(`p.${page}  ·  웨이브 ${waveIdx+1}/${waves.length-1}`,'',1.3)}
  spawnT=.7;}
function spawn(type){const d=ET[type],left=type!=='boss'&&R()<.5;
  const e={type,x:left?-40:W+(type==='boss'?90:40),y:GY,vx:0,vy:0,face:left?1:-1,hp:Math.round(d.hp*(1+(page-1)*.18)),stun:0,cd:1+R()*.8,wind:0,atkF:0,
    dead:false,deadT:0,gone:false,ground:true,hitT:0,t:R()*10,w:14*d.sc,st:'walk',stT:1.5,ch:0,jumped:0,hitP:false,fly:false,rot:0,spin:0,flyHits:new Set()};
  e.maxhp=e.hp;enemies.push(e);}
function showBanner(t,sub,dur){banner={t,sub,time:0,dur}}
function addText(x,y,s,col,size){texts.push({x,y,s,col,size,t:0,rot:(Math.random()-.5)*.4})}
function splat(x,y,n,col){for(let i=0;i<n;i++){const a=R()*6.28,s=100+R()*360;parts.push({k:'blot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-150,r:2+R()*6,life:.5+R()*.5,t:0,col})}}
function stain(x,y,r,col){sctx.fillStyle=col;sctx.globalAlpha=.18;for(let i=0;i<8;i++){sctx.beginPath();sctx.arc(x+(R()-.5)*r*1.6,y+(R()-.5)*r*.6,r*(.3+R()*.6),0,6.28);sctx.fill()}sctx.globalAlpha=1}
function crack(x,y,dirx){sctx.strokeStyle=PEN;sctx.lineCap='round';for(let i=0;i<7;i++){let px=x,py=y;const a=(dirx>0?Math.PI:0)+(R()-.5)*2.4;sctx.lineWidth=2.2;sctx.beginPath();sctx.moveTo(px,py);
  for(let s=0;s<4;s++){px+=Math.cos(a+(R()-.5)*.8)*(10+R()*18);py+=Math.sin(a+(R()-.5)*.8)*(10+R()*18);sctx.lineTo(px,py);sctx.lineWidth=2.2-s*.4}sctx.stroke()}}
function groundCrack(x,w){sctx.strokeStyle=PEN;sctx.lineWidth=1.8;for(let i=0;i<5;i++){let px=x+(R()-.5)*w*.4,py=GY;sctx.beginPath();sctx.moveTo(px,py);for(let s=0;s<3;s++){px+=(R()-.5)*w*.5;py+=6+R()*8;sctx.lineTo(px,py)}sctx.stroke()}}
function impact(x,y,big){parts.push({k:'star',x,y,r:big?46:28,life:big?.16:.11,t:0,col:big?YEL:PAPER});
  if(big){for(let i=0;i<10;i++){const a=R()*6.28;parts.push({k:'speed',x,y,a,len:60+R()*60,life:.18,t:0})}}
  zx=x;zy=y;zoom=Math.max(zoom,big?.09:.035);if(big&&!RM)impactT=.05}

    const tp=learnedTop(),bc=Math.round(blockChance(tp)*100);txt(`학습 중 · 당신의 ${TNAME[tp]} 패턴 → 차단 ${bc}%`,W/2,116,18,PEN,'center',400)}

function drawBanner(){if(!banner)return;const k=banner.time,a=Math.min(1,k*5,(banner.dur-k)*4);ctx.save();ctx.globalAlpha=Math.max(0,a);
  const y=banner.sub?205:220,sc=1+Math.max(0,.15-k)*2;ctx.translate(W/2,y);ctx.scale(sc,sc);ctx.rotate(-.03);
  ctx.font=`700 54px ${FONT}`;ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle=PAPER;ctx.textBaseline='middle';ctx.strokeText(banner.t,0,0);txt(banner.t,0,0,54,RED);
  const tw=ctx.measureText(banner.t).width;inkLine(-tw/2,26,tw/2,24,3,RED,2);if(banner.sub)txt(banner.sub,0,56,24,PEN,'center',400);ctx.restore()}
function drawTear(){if(!tear)return;const k=Math.min(1,tear.t/tear.dur),e=k*k*(3-2*k);
  for(const side of [-1,1]){ctx.save();ctx.translate(side*e*W*.62,e*60);ctx.rotate(side*e*.12);ctx.globalAlpha=1-Math.max(0,k-.7)/.3;
    ctx.beginPath();ctx.moveTo(side<0?-40:W+40,-40);for(const p of tear.pts)ctx.lineTo(p[0],p[1]);ctx.lineTo(side<0?-40:W+40,H+40);ctx.closePath();ctx.save();ctx.clip();ctx.drawImage(tearCv,0,0,W,H);ctx.restore();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.beginPath();tear.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.strokeStyle='rgba(74,77,85,.35)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}}
function drawStamp(x,y,r){ctx.save();ctx.translate(x,y);ctx.rotate(-.18);ctx.globalAlpha=.85;inkCircle(0,0,r,3,RED);inkCircle(0,0,r-5,1.4,RED);txt('가온',0,-6,r*.55,RED);txt('연구소',0,r*.32,r*.32,RED,'center',400);ctx.restore()}
function drawGround(){for(let x=0;x<W;x+=160)inkLine(x,GY+1,x+170,GY+jit(1.5),2.6,PEN,1.6);ctx.save();ctx.globalAlpha=.3;for(let x=80;x<W;x+=22)inkLine(x,GY+6,x-10,GY+18,1.2,PEN,.4);ctx.restore()}
const SKILLS=[
  ['J J J J','펀치 ×4','4단 콤보','잽·스트레이트·훅·어퍼컷'],
  ['K','킥','회오리 킥','적을 벽까지 날림'],
  ['→ →','▶ 두 번','달리기','같은 방향 빠르게 두 번'],
  ['달리며 J','달리며 펀치','어깨 돌진','들이받아 날림'],
  ['달리며 K','달리며 킥','슬라이딩','발을 걸어 띄움'],
  ['↑ ↑','점프 두 번','슈퍼 점프','공중에서 한 번 더'],
  ['공중 J','공중 펀치','공중 콤보','5번째에 내려꽂기'],
  ['공중 K','공중 킥','낙하 강타','높을수록 강함'],
  ['Shift','대시','대시','잠깐 무적 돌진'],
  ['L','필살','변신','분노가 꽉 찼을 때'],
  ['변신 중 L','변신 중 필살','잉크 광선','화면 끝까지 발사'],
  ['변신 중 Shift','변신 중 대시','순간이동','지나가며 공격']];
function drawSkills(x,y,colW,rowH,desc){SKILLS.forEach((sk,i)=>{const cx=x+(i>=6?colW:0),cy=y+(i%6)*rowH,key=TOUCH?sk[1]:sk[0];

  txt(sk[2],cx+kw+10,cy,22,i>=9?RED:PEN,'left');if(desc){ctx.font=`700 22px ${FONT}`;const nw=ctx.measureText(sk[2]).width;txt(sk[3],cx+kw+20+nw,cy+1,17,PEN,'left',400)}})}

  ctx.save();ctx.translate(W/2,84);ctx.rotate(-.03);ctx.font=`700 92px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';

  const j=drawStick(HX,GY,1,pose,INK,1.2,3.8),h=j.head;inkLine(h[0]-12,h[1]-5,h[0]+12,h[1]-6,3,RED,.6);inkLine(h[0]-12,h[1]-5,h[0]-40,h[1]-2+Math.sin(titleT*14)*4,2.6,RED,1);

    drawStick(EX,GY,-1,{lean:-8,l1:[.5,-.4],l2:[-.4,-.3],a1:[2.2,.6],a2:[-1.8,.5]},RED,1.1,3);ctx.restore();

  if(Math.floor(rt*2)%2===0)txt(TOUCH?'화면을 터치해서 시작':'Enter 를 눌러 시작',770,200,30,RED);
  if(best>0)txt('최고 점수 '+best.toLocaleString('ko-KR'),770,236,20,PEN,'center',400);
  txt(TOUCH?'게임 중 「기술」 버튼 = 기술표':'게임 중 H = 기술표',770,268,18,PEN,'center',400);

function drawOver(){ctx.fillStyle='rgba(246,248,243,.82)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,170);ctx.rotate(-.03);txt('잉크가 다 떨어졌다…',0,0,70,RED);ctx.restore();

function render(){ctx.setTransform(DPR,0,0,DPR,0,0);seed=1+Math.floor(rt/.12)*7919;

    const sz=40+k*46;ctx.translate(P.x+(Math.random()-.5)*8*k,P.y-150+(Math.random()-.5)*8*k);ctx.lineWidth=8;ctx.strokeStyle=DESK;ctx.font=`700 ${sz}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText('으아아아아!!',0,0);txt('으아아아아!!',0,0,sz,FLAME);ctx.restore()}
  if(impactT>0){ctx.globalCompositeOperation='difference';ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
  drawHUD();drawBanner();if(state==='over')drawOver();if(paused)drawPause();drawTear()}

drawPaper();resetPlayer();
let last=performance.now();
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();pressed.clear();requestAnimationFrame(frame)}
const go=()=>requestAnimationFrame(t=>{last=t;frame(t)});
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load(`700 40px Gaegu`),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(go,go);
})();

{id:'bomb',name:'숫자폭탄',tag:'운·눈치',min:2,time:'1–2분',color:'#fae8df',art:'bomb',desc:'숫자는 점점 좁아지고, 심장은 두근두근.',short:'숨은 숫자를 피하세요.',rules:['1부터 99 사이에 폭탄 숫자가 숨어 있어요.','차례대로 숫자를 입력하면 안전한 범위가 줄어들어요.','숨은 숫자를 정확히 맞힌 사람이 걸려요. 30초가 지나면 차례를 넘겨요.']},
{id:'count',name:'31은 안 돼!',tag:'운·눈치',min:2,time:'1–2분',color:'#eee5f6',art:'count',desc:'하나, 둘, 셋… 마지막은 너야!',short:'31을 부르면 걸려요.',rules:['1부터 순서대로, 한 번에 1~3개의 숫자를 골라요.','다음 친구는 이어지는 숫자를 골라요.','31을 말한 사람이 걸려요. 차례마다 제한 시간은 30초예요.']},
{id:'liar',name:'쉿! 라이어',tag:'두뇌·추리',min:3,time:'3–5분',color:'#e7edde',art:'liar',desc:'우리 중 한 명, 아무것도 모른다.',short:'말 속에 숨은 거짓말.',rules:['각자 역할을 확인해요. 한 명만 제시어를 몰라요.','한 명씩 단어를 직접 말하지 않고 힌트를 말하거나 입력해요.','라이어를 투표로 찾아요. 동률이면 라이어 승! 잡혀도 20초 안에 제시어를 맞히면 역전해요.']},
{id:'balance',name:'취향 반반',tag:'취향·토크',min:2,time:'1–2분',color:'#f9edcb',art:'balance',desc:'둘 다 싫어도 하나만 골라야 해.',short:'이 선택, 정말 가능해?',rules:['A와 B 중 딱 하나를 골라 비공개로 투표해요.','모두 투표하거나 60초가 지나면 취향을 공개해요.','승패 없는 토크 게임이에요. 고른 이유를 말하면 더 재밌어요.']},
{id:'quiz',name:'초성 스피드',tag:'두뇌·추리',min:2,time:'30초',color:'#e4edf2',art:'quiz',desc:'머릿속엔 있는데… 먼저 쓴 사람이 승!',short:'정답을 가장 먼저 입력!',rules:['카운트다운 뒤 초성과 주제를 보고 정답을 입력해요.','20초 동안 몇 번이든 도전할 수 있어요. 8초 뒤 힌트가 나와요.','제시된 단어를 먼저 맞히면 1점! 띄어쓰기는 달라도 괜찮아요.']},
{id:'challenge',name:'5초 챌린지',tag:'취향·토크',min:2,time:'30초',color:'#f7e4e8',art:'challenge',desc:'어? 어! 하다 끝나는 마법의 5초.',short:'5초 안에 세 가지 말하기.',rules:['무작위로 뽑힌 도전자가 준비 버튼을 눌러요.','나온 주제에 맞는 세 가지를 5초 안에 입으로 말해요.','같은 자리에서 친구들이 함께 듣고, 방장이 성공 여부를 눌러요. 성공하면 1점!']},
{id:'timing',name:'7초의 감각',tag:'운·눈치',min:2,time:'1분',color:'#e3eaf5',art:'timing',desc:'시계는 숨겼어. 네 감각을 믿어봐.',short:'딱 7초, 지금이야!',rules:['각자 시작을 누르고 마음속으로 7초를 세어요.','화면에는 숫자가 안 나와요. 7초라고 느끼면 멈춰요.','자기 기기로 잰 기록 중 7초에 가장 가까운 사람이 1점! 제한 시간은 90초예요.']},

const app={room:null,session:null,filter:'전체',modal:null,avatar:0,name:store.get('gaon_name')||'',busy:false,sound:store.get('gaon_sound')==='on',selected:'bomb',offset:0,secret:false,mission:false,connectionFailures:0,timerStart:0,timerRound:null,renderKey:'',lastResult:null,newScene:false,justFlipped:false,local:false,localRoom:null,gateSeat:null,localNames:['',''],localBusy:false};

function avatar(n){const bg=['#f5dcc2','#e5d8ef','#e6e8cc','#eed7d2','#d6e6e8','#e7dbbf','#e0d9ee','#dce8d2'][n%8];const ear=n%3===0?'<ellipse cx="20" cy="13" rx="6" ry="11" fill="'+bg+'"/><ellipse cx="44" cy="13" rx="6" ry="11" fill="'+bg+'"/>':n%3===1?'<path d="m10 25 3-17 15 12m8 0 15-12 3 18" fill="'+bg+'"/>':'<circle cx="15" cy="17" r="9" fill="'+bg+'"/><circle cx="49" cy="17" r="9" fill="'+bg+'"/>';return '<span class="avatar" aria-hidden="true"><svg viewBox="0 0 64 64">'+ear+'<ellipse cx="32" cy="35" rx="26" ry="23" fill="'+bg+'"/><circle cx="23" cy="33" r="2.3" fill="#675447"/><circle cx="41" cy="33" r="2.3" fill="#675447"/><ellipse cx="17" cy="40" rx="5" ry="3" fill="#eaa4a0" opacity=".7"/><ellipse cx="47" cy="40" rx="5" ry="3" fill="#eaa4a0" opacity=".7"/><path d="m28 39 4 3 4-3" fill="none" stroke="#675447" stroke-width="2" stroke-linecap="round"/></svg></span>';}
function artFor(g){return ART[g.art]||ART.bomb;}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3700);}
function header(){return '<header class="site-header"><div class="wrap header-inner"><button class="brand" data-a="brand" aria-label="짠! 놀이터 처음으로"><span class="brand-stamp"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m7 13 11-3 4 19-11 3-4-19Zm16-3 11 3-4 19-11-3 4-19ZM8 19l11-3m3 0 11 3M17 5l1 3m8-3-1 3"/></svg></span><span><span class="brand-name">짠! 놀이터</span><span class="brand-by">BY GAON LAB</span></span></button><nav class="header-actions" aria-label="주 메뉴">'+(!app.room?'<a class="nav-link" href="#games">게임 둘러보기</a>':'<span class="nav-link">'+(app.local?'한 휴대폰 모드':esc(app.room.code)+'번 테이블')+'</span>')+'<button class="icon-btn" data-a="sound" aria-label="효과음 '+(app.sound?'끄기':'켜기')+'" title="효과음 '+(app.sound?'켜짐':'꺼짐')+'">'+icon(app.sound?'sound':'mute')+'</button>'+(!app.room?'<button class="btn btn-light btn-small" data-a="open-join">방 코드로 참가</button>':'<button class="btn btn-light btn-small" data-a="leave">'+icon('door')+'나가기</button>')+'</nav></div></header>';}
function footer(){return '<footer class="site-footer">'+gaon()+'<span class="muted">함께 웃는 시간을 만듭니다.<br>술 대신 음료와 함께해도, 재미는 그대로.</span></footer>';}
function card(g,i,room=false){return '<button class="game-card '+(room&&app.room.selected===g.id?'selected':'')+'" style="background:'+g.color+'" data-a="rules" data-game="'+g.id+'" aria-label="'+g.name+' 규칙 보기"><span class="card-top"><span class="game-number">'+String(i+1).padStart(2,'0')+'</span><span class="pill">'+g.min+'명 이상</span></span><span class="art">'+artFor(g)+'</span><h3>'+g.name+'</h3><p>'+g.short+'</p><span class="card-bottom"><span>'+g.tag+' · '+g.time+'</span><span class="card-arrow">'+icon('arrow')+'</span></span></button>';}
function home(){const resume=store.get('gaon_current');return header()+'<main class="wrap">'+(resume?'<div class="resume-bar"><span>참가했던 방이 있어요.</span><button class="text-btn" data-a="resume" data-code="'+esc(resume)+'">이어서 놀기 '+icon('arrow')+'</button></div>':'')+'<section class="hero"><div><span class="eyebrow"><span class="dot"></span>친구만 모이면, 여기가 놀이터</span><h1>잔은 가볍게,<br><span>웃음은 가득하게.</span></h1><p>어색한 첫 잔부터 아쉬운 마지막 잔까지.<br>우리끼리 즐기는 열 가지 게임, 한곳에 모았어요.</p><div class="hero-buttons"><button class="btn btn-primary" data-a="open-local">'+icon('phone')+'휴대폰 하나로 놀기</button><button class="btn btn-dark" data-a="open-create">'+icon('plus')+'우리 방 만들기</button><button class="btn btn-light" data-a="open-join">친구 방 들어가기 '+icon('arrow')+'</button></div><div class="hero-note"><span>'+icon('check')+'설치 없이 바로</span><span>'+icon('phone')+'휴대폰 하나로도, 각자 휴대폰으로도</span><span>'+icon('users')+'2–12명 함께</span></div></div><div class="hero-art">'+ART.hero+'<span class="art-sticker">오늘의 안주: 웃음 한 접시</span></div></section><section id="games"><div class="section-head"><div><h2>오늘 뭐 하고 놀까?</h2><p>익숙한 게임도, 우리끼리 하면 또 새롭지.</p></div><div class="filters" aria-label="게임 종류">'+['전체','운·눈치','두뇌·추리','취향·토크'].map(f=>'<button class="filter '+(app.filter===f?'active':'')+'" data-a="filter" data-filter="'+f+'" aria-pressed="'+(app.filter===f)+'">'+f+(f==='전체'?' 10':'')+'</button>').join('')+'</div></div><div class="game-grid">'+GAMES.filter(g=>app.filter==='전체'||g.tag===app.filter).map(g=>card(g,GAMES.indexOf(g))).join('')+'</div></section><aside class="room-banner"><div class="flex"><span class="icon-circle">'+icon('link')+'</span><div><h3>링크 하나면, 모일 준비 끝.</h3><p>방 만들기 → 초대 링크 보내기 → 각자 닉네임 입력. 이제 놀아요!</p></div></div><button class="btn btn-light btn-small" data-a="open-create">같이 놀 친구 부르기 '+icon('arrow')+'</button></aside>'+footer()+'</main>';}
function sidebar(){const r=app.room;return '<aside class="room-side"><div class="panel"><div class="side-title"><span>'+iconInline('users')+'오늘의 멤버</span><span class="pill">'+active().length+' / 12</span></div>'+(app.local?'<p class="tiny muted invite-note" style="margin-bottom:12px">휴대폰 하나를 돌려 가며 함께 해요. 차례가 되면 넘겨받아요.</p>':'<p class="tiny muted invite-note">이 코드를 알려주거나 초대 링크를 보내요.</p><div class="code-box"><code>'+esc(r.code)+'</code><button class="icon-btn" data-a="copy-code" aria-label="방 코드 복사">'+icon('copy')+'</button></div>')+'<div class="players-list">'+active().map(p=>'<div class="player-row">'+avatar(p.avatar)+'<span class="player-name">'+esc(p.name)+(p.id===me()?'<small>나</small>':'')+(p.id===r.hostId?'<small>방장</small>':'')+'</span><span class="online-dot '+(!r.onlineIds.includes(p.id)?'offline-dot':'')+'" title="'+(r.onlineIds.includes(p.id)?'접속 중':'연결 기다리는 중')+'"></span><span class="points">'+p.score+'점</span>'+(isHost()&&!app.local&&p.id!==me()?'<button class="remove" data-a="remove" data-target="'+p.id+'" aria-label="'+esc(p.name)+' 내보내기">×</button>':'')+'</div>').join('')+'</div><div class="side-bottom">'+(app.local?'<p class="footer-note" style="margin:0">로봇 친구는 부족한 인원을<br>자동으로 채워 줘요.</p>':'<button class="btn btn-light btn-wide" data-a="invite">'+icon('link')+'초대 링크 보내기</button><p class="footer-note">게임 중에는 새 친구가<br>대기실로 돌아온 뒤 참가해요.</p>')+'</div>'+(!app.local&&r.canClaimHost?'<button class="btn btn-soft btn-wide can-claim" data-a="claim-host" style="margin-top:14px">방장이 자리를 비웠어요 · 방장 맡기</button>':'')+'</div></aside>';}
function iconInline(n){return '<span style="display:inline-flex;vertical-align:middle;margin-right:7px">'+icon(n)+'</span>';}
function needsGate(r){const t=r.round?.type;return !(t==='quiz'||(t==='challenge'&&r.round.phase==='judge'));}

function roomPage(){const r=app.room;if(r.status==='ended')return ending();if(app.local&&r.status==='playing'&&r.round&&r.round.phase!=='result'&&r.me!==app.gateSeat&&needsGate(r))return gateScreen();return header()+'<main class="wrap"><div class="room-top"><div><h1>우리끼리, 한 테이블.</h1><p class="tiny muted">'+(r.status==='lobby'?'준비되면 오늘의 첫 게임을 골라요.':'같이 웃을수록, 더 재밌어져요.')+'</p></div><span class="pill"><span class="dot"></span>함께 연결됨</span></div>'+(r.notice?'<div class="notice">'+esc(r.notice)+'</div>':'')+'<div class="room-layout"><section class="room-main">'+(r.status==='lobby'?lobby():gameScreen())+'</section>'+sidebar()+'</div>'+footer()+'</main>';}
function lobby(){const g=game(app.room.selected);return '<div class="selected-preview" style="background:'+g.color+'"><div class="art">'+artFor(g)+'</div><div><span class="pill">이번엔 이 게임 어때?</span><h2>'+g.name+'</h2><p>'+g.desc+'</p><button class="text-btn" data-a="rules" data-game="'+g.id+'">'+icon('help')+'게임 방법 보기</button></div></div><div class="lobby-start"><p>'+(!isHost()?'방장이 시작하면 같은 화면에서 함께해요.':app.local&&active().length<g.min?'친구가 부족하면 로봇 친구가 함께해요. 바로 시작해도 좋아요.':active().length<g.min?'친구 '+(g.min-active().length)+'명이 더 오면 시작할 수 있어요.':'모두 준비됐나요? 언제든 다른 게임으로 바꿀 수 있어요.')+'</p>'+(isHost()?'<button class="btn btn-primary" data-a="start" '+((!app.local&&active().length<g.min)||app.busy?'disabled':'')+'>'+icon('spark')+'이 게임 시작하기</button>':'<span class="dots-wait" aria-label="방장의 시작을 기다리는 중">···</span>')+'</div><div class="section-head" style="margin-top:14px"><div><h2 style="font-size:18px">'+(isHost()?'다른 게임도 골라봐요':'오늘의 게임 열 가지')+'</h2><p>마음이 바뀌어도 괜찮아요. 바로 다음 게임으로!</p></div></div><div class="game-grid room-games">'+GAMES.map((g,i)=>card(g,i,true)).join('')+'</div>'+(isHost()?'<div class="round-controls"><span class="tiny muted">점수는 이 방에서 이어져요.</span><button class="text-btn" data-a="end">모임 마무리 '+icon('arrow')+'</button></div>':'');}
function timer(r){return r.deadline?'<span class="timer-pill" data-timer-pill>'+icon('clock')+'<span data-deadline="'+r.deadline+'">'+Math.max(0,Math.ceil((r.deadline-now())/1000))+'</span>초</span>':'';}
function turn(r){return '<div class="turn-label '+(r.turnId===me()?'my-turn':'')+'">'+avatar(person(r.turnId)?.avatar||0)+(r.turnId===me()?'지금 내 차례예요!':esc(personName(r.turnId))+'님 차례예요')+'</div>';}

function answerForm(kind,placeholder,disabled=false,max=40){return '<form class="answer-form" data-form="'+kind+'"><label class="screen-reader" for="answer-'+kind+'">'+esc(placeholder)+'</label><input class="input keep" id="answer-'+kind+'" name="value" '+(kind==='guess'?'type="number" inputmode="numeric" min="'+app.room.round.lo+'" max="'+app.room.round.hi+'" step="1"':'type="text"')+' maxlength="'+max+'" placeholder="'+esc(placeholder)+'" autocomplete="off" required '+(disabled?'disabled':'')+'><button class="btn btn-primary" type="submit" '+(disabled||app.busy?'disabled':'')+'>'+((kind==='quiz'||kind==='telepathy')?'정답!':kind==='clue'?'힌트 보내기':'확인')+'</button></form>';}
function renderHistory(r){return '<div class="history">'+(r.history||[]).slice(-6).map(h=>'<span class="history-item">'+esc(personName(h.id))+' <span class="hist-value">'+esc(h.value??'')+'</span>'+esc(h.text)+'</span>').join('')+'</div>';}
function secretCard(r){const shown=app.secret;let title='',note='';if(r.type==='liar'){title=r.myRole==='liar'?'당신은 라이어!':r.word;note=r.myRole==='liar'?'주제만 보고 자연스럽게 연기해요.':'제시어를 그대로 말하면 안 돼요.';}else{title=r.kingId===me()?'당신이 오늘의 왕!':r.myNumber+'번';note=r.kingId===me()?'친구들의 번호는 아직 비밀이에요.':'이 번호의 주인이라는 건 잠깐 비밀.';}return '<button class="secret-card '+(shown?'revealed':'')+' '+(app.justFlipped?'just-flipped':'')+'" data-a="secret" aria-label="내 비밀 역할 '+(shown?'숨기기':'확인하기')+'">'+(shown?'<span class="secret-word">'+esc(title)+'</span><p>'+note+'</p><small>다시 누르면 가려져요.</small>':icon('lock')+'<span class="secret-word" style="font-size:22px">나만 살짝 보기</span><p>누르면 내 역할이 보여요.</p><small>옆 친구에게는 비밀!</small>')+'</button>';}
function personVotes(r,op){return '<div class="voting-grid">'+r.order.filter(id=>id!==me()).map(id=>'<button class="vote-person '+(r.myVote===id?'selected':'')+'" data-a="vote-person" data-target="'+id+'" '+(r.myVote||app.busy?'disabled':'')+'>'+avatar(person(id)?.avatar||0)+'<span>'+esc(personName(id))+'</span></button>').join('')+'</div>';}
function gameScreen(){const r=app.room.round,g=game(r.type);return '<div class="panel game-stage '+(app.newScene?'scene-enter':'')+'" data-round="'+r.id+'"><div class="stage-head"><div><div class="stage-tag">ROUND '+String(app.room.rounds).padStart(2,'0')+' · '+g.tag+'</div><h2>'+g.name+'</h2></div>'+timer(r)+'</div><div class="game-body">'+(r.phase==='result'?result(r,g):play(r,g))+'</div></div>'+(isHost()?'<div class="round-controls"><button class="text-btn" data-a="lobby">'+icon('home')+'게임 고르기</button><button class="text-btn" data-a="end">모임 마무리 '+icon('arrow')+'</button></div>':'<p class="footer-note">방장이 다음 게임을 선택할 수 있어요.</p>')+'<details class="rule-details"><summary>잠깐, 이 게임 어떻게 하지?</summary><p>'+g.rules.map(esc).join('<br>')+'</p></details>';}
function play(r,g){
 const mine=r.turnId===me(),count=r.order.length,art='<div class="game-art">'+artFor(g)+'</div>';
 if(r.type==='bomb')return art+'<p class="game-subtitle">이 사이에 숨어 있어요.<br>정확히 맞히면… 펑!</p><div class="range-display"><div>'+r.lo+'<small>최솟값</small></div><span class="range-dash">–</span><div>'+r.hi+'<small>최댓값</small></div></div>'+turn(r)+answerForm('guess',r.lo+' ~ '+r.hi+' 중 하나',!mine)+renderHistory(r)+turns(r);
 if(r.type==='count')return art+'<p class="game-subtitle">지금까지 나온 숫자</p><div class="big-number">'+r.count+'</div><div class="progress-track"><div style="width:'+(r.count/31*100)+'%"></div></div>'+turn(r)+'<div class="count-choices">'+[1,2,3].map(n=>'<button class="count-btn" data-a="count" data-value="'+n+'" '+(!mine||app.busy||r.count+n>31?'disabled':'')+'><span class="numbers">'+(r.count+n<=31?Array.from({length:n},(_,i)=>r.count+i+1).join(' · '):'—')+'</span><small>'+n+'개 부르기</small></button>').join('')+'</div>'+renderHistory(r)+turns(r);
 if(r.type==='liar'){
  let html='<span class="pill">이번 주제 · '+esc(r.category)+'</span>';
  if(r.phase==='reveal')return html+secretCard(r)+(r.ready.includes(me())?waiting('확인 완료! 친구들을 기다려요.'):'<button class="btn btn-primary" data-a="ready">역할 확인했어요 '+icon('check')+'</button>')+'<p class="footer-note">'+r.ready.length+' / '+count+'명 확인 · 모두 확인하면 시작해요.</p>';
  if(r.phase==='talk')return html+'<h3 class="question">그 단어, 한 문장으로 표현하면?</h3><p class="game-subtitle">말로 설명하거나 짧은 힌트를 적어요.<br>라이어는 들키지 않게 눈치를 살펴요.</p>'+secretCard(r)+(r.clues?.[me()]?waiting('내 힌트를 보냈어요.'):answerForm('clue','정답은 말하지 말고, 힌트만',false,80))+'<div class="clue-list">'+r.order.filter(id=>r.clues?.[id]).map(id=>'<div class="clue-item"><span class="name">'+esc(personName(id))+'</span>'+esc(r.clues[id])+'</div>').join('')+'</div><div class="turn-order">'+r.order.map((id,i)=>'<span class="order-chip">'+(i+1)+'. '+esc(personName(id))+'</span>').join('')+'</div>'+(isHost()?'<button class="btn btn-dark" data-a="open-vote">이제 라이어를 지목해요 '+icon('arrow')+'</button>':'<p class="tiny muted">설명이 끝나면 방장이 투표를 열어요.</p>');
  if(r.phase==='vote')return html+art+'<h3 class="question">가장 수상한 친구는 누구?</h3><p class="game-subtitle">투표는 한 번만! 동률이면 라이어가 탈출해요.</p>'+personVotes(r,'vote')+(r.myVote?waiting('쉿, 투표했어요. 결과를 기다려요.'):'')+countSubmitted(r.voted.length,count);
  if(r.phase==='guess')return art+'<h3 class="question">'+esc(personName(r.liarId))+'님,<br>마지막 반전의 기회!</h3><p class="game-subtitle">라이어가 20초 안에 제시어를 맞히면 역전해요.</p>'+(r.liarId===me()?answerForm('liarGuess','제시어가 뭐였을까요?'):'<div class="secret-card revealed" style="cursor:default"><span class="secret-word">'+esc(r.word)+'</span><p>정답은 비밀! 마지막 답을 기다려요.</p></div>');
 }
 if(r.type==='balance')return art+'<h3 class="question">딱 하나만 고른다면?</h3><div class="choices">'+['a','b'].map(v=>'<button class="choice '+v+' '+(r.myVote===v?'selected':'')+'" data-a="balance-vote" data-choice="'+v+'" '+(r.myVote||app.busy?'disabled':'')+'><span class="letter">'+v.toUpperCase()+'</span><span>'+esc(r.question[v])+'</span></button>').join('')+'</div>'+(r.myVote?waiting('선택 완료! 다른 친구는 뭘 골랐을까요?'):'')+countSubmitted(r.voted.length,count)+revealButton();
 if(r.type==='quiz'){const ready=now()<r.startedAt;return art+'<span class="pill">주제 · '+esc(r.category)+'</span>'+(ready?'<div class="ready-go" data-start="'+r.startedAt+'">'+Math.max(1,Math.ceil((r.startedAt-now())/1000))+'</div><p class="game-subtitle">준비, 먼저 맞히는 사람이 승!</p>':'<div class="initials">'+esc(r.initials)+'</div>'+(app.local?'<p class="game-subtitle">정답을 가장 먼저 말한 친구를 눌러 주세요.</p><div class="voting-grid">'+r.order.map(id=>'<button class="vote-person" data-a="quiz-winner" data-target="'+id+'" '+(app.busy?'disabled':'')+'>'+avatar(person(id)?.avatar||0)+'<span>'+esc(personName(id))+'</span></button>').join('')+'</div>':answerForm('quiz','떠오른 정답을 빠르게!'))+(r.hint?'<div class="hint-box">힌트 · '+esc(r.hint)+'</div>':'<p class="tiny muted">8초 뒤 작은 힌트가 나와요.</p>'))+revealButton();}
 if(r.type==='challenge'){const challenger=r.challenger===me();if(r.phase==='ready')return art+'<span class="pill">오늘의 도전자 · '+esc(personName(r.challenger))+'</span><h3 class="question">5초, 준비됐나요?</h3><p class="game-subtitle">주제가 나오면 세 가지를 입으로 말해요.<br>방장은 친구들과 함께 성공 여부를 판정해요.</p>'+(challenger?'<button class="btn btn-primary" data-a="challenge-start">준비됐어요! 시작 '+icon('arrow')+'</button>':waiting(personName(r.challenger)+'님의 준비를 기다려요.'));if(r.phase==='play'&&(now()<r.startedAt||!r.prompt))return art+'<h3 class="question">도전 준비!</h3><div class="ready-go" data-start="'+r.startedAt+'">3</div><p class="game-subtitle">곧 주제가 나와요. 5초 안에 세 가지!</p>';if(r.phase==='play')return '<span class="pill">'+esc(personName(r.challenger))+'님의 도전</span><h3 class="question">'+esc(r.prompt)+'</h3><div class="time-circle"><span class="seconds" data-tenths="'+r.deadline+'">5.0</span><span>SECONDS</span></div><p class="game-subtitle">생각보다 짧아요! 바로 말해요!</p>';return art+'<h3 class="question">세 가지 다 말했나요?</h3><p class="game-subtitle">'+esc(r.prompt)+'</p>'+(isHost()?'<div class="result-actions"><button class="btn btn-primary" data-a="judge" data-success="true">'+icon('check')+'성공했어요</button><button class="btn btn-light" data-a="judge" data-success="false">다음에 다시!</button></div>':waiting('방장이 친구들의 판정을 정리하고 있어요.'));}
 if(r.type==='timing'){if(r.myEntry!==undefined)return art+'<h3 class="question">내 감각, 이 정도였어!</h3><div class="time-record">'+(r.myEntry/1000).toFixed(2)+'<span style="font-size:16px;letter-spacing:0"> 초</span></div>'+waiting('기록 완료! 친구들의 결과를 기다려요.')+countSubmitted(r.submitted.length,count)+revealButton();if(!r.myStart)return art+'<h3 class="question">7초가 되면 멈춰요.</h3><p class="game-subtitle">시계 없이, 마음속으로만 세어봐요.<br>각자 시작 버튼을 누르면 도전이 시작돼요.</p><button class="btn btn-primary" data-a="timing-start">'+icon('clock')+'나의 7초 시작</button>'+countSubmitted(r.submitted.length,count);return '<h3 class="question">마음속 시계가 가고 있어요.</h3><p class="game-subtitle">일곱이라고 느껴지는 순간,<br>아래 버튼을 눌러 멈춰요!</p><button class="pulse-timer running" data-a="timing-stop">'+icon('clock')+'<span>지금 멈추기!</span></button><p class="tiny muted">이 화면을 유지해주세요. 한 번만 멈출 수 있어요.</p>';}
 if(r.type==='king'){if(r.phase==='reveal')return art+secretCard(r)+(r.ready.includes(me())?waiting('확인 완료! 왕의 등장을 기다려요.'):'<button class="btn btn-primary" data-a="ready">내 역할 확인했어요 '+icon('check')+'</button>')+'<p class="footer-note">'+r.ready.length+' / '+count+'명 확인</p>';if(r.kingId===me())return art+'<h3 class="question">왕이시여, 명령을 내려주세요.</h3><p class="game-subtitle">누군지는 몰라요. 번호만 골라봐요!</p><form data-form="decree"><div class="king-selects"><label class="screen-reader" for="king-a">첫 번째 번호</label><select class="input keep" id="king-a" name="a">'+Array.from({length:count-1},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'번</option>').join('')+'</select><span>그리고</span><label class="screen-reader" for="king-b">두 번째 번호</label><select class="input keep" id="king-b" name="b">'+Array.from({length:count-1},(_,i)=>'<option value="'+(i+1)+'" '+(i===1?'selected':'')+'>'+(i+1)+'번</option>').join('')+'</select></div><label class="field-label" for="king-mission">두 친구가 함께할 미션</label><select class="input mission-select keep" id="king-mission" name="mission">'+r.missions.map((m,i)=>'<option value="'+i+'">'+esc(m)+'</option>').join('')+'</select><button class="btn btn-primary btn-wide" type="submit">번호의 주인공 공개! '+icon('spark')+'</button></form>';return art+'<h3 class="question">오늘의 왕은<br>'+esc(personName(r.kingId))+'님!</h3>'+secretCard(r)+'<p class="game-subtitle">어떤 번호를 부를까요? 두근두근.</p>';}
 if(r.type==='telepathy'){if(now()<r.startedAt)return art+'<div class="ready-go" data-start="'+r.startedAt+'">3</div><p class="game-subtitle">같은 생각을 할 준비, 됐나요?</p>';return art+'<h3 class="question">'+esc(r.prompt)+'</h3><p class="game-subtitle">생각나는 단어 하나만. 다른 친구에게는 비밀!</p>'+(r.myAnswer?waiting('내 답: '+r.myAnswer):answerForm('telepathy','예: 치즈',false,20))+countSubmitted(r.submitted.length,count)+revealButton();}
 if(r.type==='image')return art+'<h3 class="question">'+esc(r.prompt)+'</h3><p class="game-subtitle">지금 떠오르는 그 친구, 딱 한 명만!</p>'+personVotes(r,'vote')+(r.myVote?waiting('지목했어요! 결과를 기다려요.'):'')+countSubmitted(r.voted.length,count)+revealButton();
 return '<p>다음 장면을 준비하고 있어요.</p>';
}
function revealButton(){return isHost()?'<div style="margin-top:20px"><button class="text-btn" data-a="force-reveal">기다림을 끝내고 결과 보기 '+icon('arrow')+'</button></div>':'';}
function result(r,g){let extras='';if(r.type==='balance'){const votes=r.votes||{},a=Object.values(votes).filter(x=>x==='a').length,b=Object.values(votes).filter(x=>x==='b').length,total=a+b;extras='<div class="choices"><div class="choice"><span class="letter">A · '+a+'명</span>'+esc(r.question.a)+'</div><div class="choice b"><span class="letter">B · '+b+'명</span>'+esc(r.question.b)+'</div></div><div class="vote-meter"><div style="width:'+(total?a/total*100:50)+'%">'+(a?'A '+Math.round(a/total*100)+'%':'')+'</div><div class="b" style="width:'+(total?b/total*100:50)+'%">'+(b?'B '+Math.round(b/total*100)+'%':'')+'</div></div>'+table(Object.entries(votes).map(([id,v])=>[personName(id),v.toUpperCase()]));}
 if(r.type==='telepathy')extras=table(r.order.map(id=>[personName(id),r.answers?.[id]||'미제출']));
 if(r.type==='timing')extras=table(Object.entries(r.entries||{}).sort((a,b)=>Math.abs(a[1]-7000)-Math.abs(b[1]-7000)).map(([id,ms])=>[personName(id),(ms/1000).toFixed(2)+'초 · 오차 '+(Math.abs(ms-7000)/1000).toFixed(2)+'초']));
 if(r.type==='image')extras=table(Object.entries(r.totals||{}).sort((a,b)=>b[1]-a[1]).map(([id,n])=>[personName(id),n+'표']));
 if(r.type==='liar')extras='<div class="hint-box">라이어 · '+esc(personName(r.liarId))+'<br>제시어 · '+esc(r.word)+'</div>'+(r.votes?table(Object.entries(r.votes).map(([id,target])=>[personName(id),personName(target)+' 지목'])):'');
 if(r.type==='king'&&r.chosen)extras='<div class="mission-card"><small>왕의 명령 · '+r.chosen.join('번 & ')+'번</small>'+esc(r.mission)+'</div>'+table((r.targets||[]).map(id=>[r.numbers[id]+'번',personName(id)]));
 return '<span class="result-badge">'+icon('spark')+'ROUND COMPLETE</span><div class="game-art">'+artFor(g)+'</div><h3 class="result-title">'+esc(r.result.title)+'</h3><p class="result-detail">'+esc(r.result.detail)+'</p>'+extras+(r.result.losers?.length?'<button class="btn btn-soft btn-small" data-a="mission">'+icon('shuffle')+'가벼운 미션 뽑기</button>'+(app.mission?'<div class="mission-card"><small>오늘의 작은 미션 · 패스해도 좋아요</small>'+esc(r.result.mission)+'</div>':''):'')+'<div class="result-actions">'+(isHost()?'<button class="btn btn-primary" data-a="restart">한 판 더! '+icon('arrow')+'</button><button class="btn btn-light" data-a="lobby">다른 게임 고르기</button>':waiting('방장이 다음 게임을 준비하고 있어요.'))+'</div><div class="result-brand">'+gaon()+'</div>';}
function table(rows){return '<table class="result-table"><tbody>'+rows.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td>'+esc(b)+'</td></tr>').join('')+'</tbody></table>';}
function ending(){const r=app.room,ranked=[...r.players].sort((a,b)=>b.score-a.score);return header()+'<main class="wrap"><section class="ending"><div class="ending-logo">'+gaon(true)+'</div><span class="eyebrow">가온연구소 제작</span><h1>오늘도, 잘 웃었습니다.</h1><p class="muted tiny">'+r.completed+'번의 게임, 함께한 '+r.players.length+'명의 친구.<br>이 밤의 좋은 장면은 오래 남을 거예요.</p><div class="hero-art">'+ART.hero+'</div><div class="score-list">'+ranked.map((p,i)=>'<div class="score-item"><span class="rank">'+(ranked.findIndex(x=>x.score===p.score)+1)+'</span>'+avatar(p.avatar)+'<span class="score-name">'+esc(p.name)+'</span><span class="score-point">'+p.score+' <small>점</small></span></div>').join('')+'</div><p class="tiny muted">점수 없는 토크 게임도, 웃음은 똑같이 쌓였어요.</p><div class="result-actions">'+(isHost()?'<button class="btn btn-primary" data-a="lobby">아쉬우니까 한 판만 더 '+icon('arrow')+'</button>':'')+'<button class="btn btn-light" data-a="leave">다음에 또 만나요</button></div><div class="result-brand">'+gaon()+'</div></section>'+footer()+'</main>';}
function render(){const focus=document.activeElement;const focusId=focus?.id;const selection=focus?.selectionStart;const vals={};document.querySelectorAll('#app .keep').forEach(el=>vals[el.id]=el.value);const scrollY=window.scrollY;$('#app').innerHTML=app.room?roomPage():home();if(app.keepInputs!==false){Object.entries(vals).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v;});if(focusId&&document.getElementById(focusId)){const el=document.getElementById(focusId);el.focus({preventScroll:true});try{el.setSelectionRange(selection,selection)}catch{}}}app.keepInputs=true;updateTimers();if(app.noScrollReset!==false)window.scrollTo({top:scrollY,behavior:'instant'});app.noScrollReset=true;app.newScene=false;app.justFlipped=false;}
function modalOpen(kind,extra={}){app.modal={kind,...extra};renderModal();const el=$('#modal');if(!el.open)el.showModal();setTimeout(()=>el.querySelector('input:not([type=hidden])')?.focus(),60);}

async function localApi(body,method){const E=await loadEngine(),room=app.localRoom,now=Date.now();let changed=false;
 room.players.forEach(p=>p.lastSeen=now);
 const seat=()=>room.players.find(p=>p.id===E.seatFor(room));
 if(method==='POST'){const op=body.op;
  if(op==='leave')return {ok:true,left:true,serverNow:now};
  if(op==='start')E.addBots(room,String(body.game||room.selected),now);
  const hostOps=['select','start','lobby','end','remove','openVote','judge','forceReveal','quizWinner'];
  const actor=hostOps.includes(op)?room.players.find(p=>p.id===room.hostId):seat();
  try{E.apply(room,actor,op,body,now);}catch(e){const err=new Error(e.message||'잠시 후 다시 시도해주세요.');err.status=e.status||400;throw err;}
  changed=true;}
 if(E.tick(room,now))changed=true;
 if(E.botStep(room,now))changed=true;
 if(changed)room.revision++;
 return E.view(room,seat(),now);}
async function startLocal(names){const E=await loadEngine();app.localRoom=E.createLocalRoom(names);app.local=true;app.offset=0;app.session={code:'LOCAL',token:'local'};app.selected='bomb';const data=await localApi(null,'GET');app.gateSeat=data.me;modalClose();accept(data);schedulePoll(1000);window.scrollTo({top:0,behavior:'instant'});}
async function api(body,token,method='POST',code){if(app.local&&token==='local')return localApi(body,method);const t0=Date.now();const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),14000);try{const response=await fetch(API+(method==='GET'?'?code='+encodeURIComponent(code):''),{method,headers:{...(method==='POST'?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},...(method==='POST'?{body:JSON.stringify(body)}:{}),credentials:'omit',cache:'no-store',signal:controller.signal});let data;try{data=await response.json()}catch{throw new Error('서버에 연결할 수 없어요. 잠시 후 다시 눌러주세요.')}if(!response.ok){const e=new Error(data.error||'잠시 후 다시 시도해주세요.');e.status=response.status;throw e;}if(data.serverNow)app.offset=data.serverNow-(t0+Date.now())/2;return data;}catch(e){if(e.name==='AbortError')throw new Error('연결이 늦어지고 있어요. 인터넷을 확인하고 다시 눌러주세요.');throw e;}finally{clearTimeout(timeout);}}
function accept(data){if(!data?.code||app.session?.code!==data.code)return;if(app.room&&data.code===app.room.code&&data.revision<app.room.revision)return;const beforeStatus=app.room?.status;if(app.local&&(data.status!=='playing'||!data.round||data.round.phase==='result'))app.gateSeat=data.me;const before=app.room?.round;app.newScene=before?.id!==data.round?.id||before?.phase!==data.round?.phase;const signature=JSON.stringify([data.revision,now()>=(data.round?.startedAt||0),data.round?.initials,data.round?.hint,data.round?.prompt,data.onlineIds,data.canClaimHost]);if(before?.id!==data.round?.id){app.secret=false;app.mission=false;app.keepInputs=false;app.timerStart=0;app.timerRound=null;}app.room=data;if(data.round?.startedAt>now()){clearTimeout(roundStartTimer);const roundId=data.round.id;roundStartTimer=setTimeout(()=>{if(app.room?.round?.id===roundId){render();poll();}},data.round.startedAt-now()+15);}if(signature!==app.renderKey){app.renderKey=signature;render();if(before?.id!==data.round?.id||beforeStatus!==data.status)window.scrollTo({top:0,behavior:'instant'});}if(data.round?.phase==='result'&&app.lastResult!==data.round.id){app.lastResult=data.round.id;celebrate();tone('result');}}
function saveSession(data){app.session={code:data.code,token:data.token};store.set('gaon_session_'+data.code,JSON.stringify(app.session));store.set('gaon_current',data.code);store.set('gaon_name',app.name);const url=new URL(location.href);url.searchParams.set('room',data.code);try{window.history.replaceState(null,'',url)}catch{};accept(data);schedulePoll(800);}
let roundStartTimer;let pollTimer;function schedulePoll(delay=1200){clearTimeout(pollTimer);if(app.session)pollTimer=setTimeout(poll,delay);}
async function poll(){const s=app.session;if(!s)return;try{const data=await api(null,s.token,'GET',s.code);if(app.session?.token!==s.token)return;app.connectionFailures=0;$('#connection').innerHTML='';accept(data);}catch(e){if(app.session?.token!==s.token)return;if([401,404,410].includes(e.status)){clearSession();toast(e.message);return;}app.connectionFailures++;if(app.connectionFailures>1)$('#connection').innerHTML='<div class="connection-banner">연결을 다시 시도하고 있어요. 인터넷이 돌아오면 이어서 할 수 있어요.</div>';}finally{if(app.session?.token===s.token)schedulePoll(Math.min(6000,1200*(app.connectionFailures+1)));}}
async function action(op,extra={}){if(app.busy||!app.session)return null;app.busy=true;document.querySelectorAll('[data-server],#app button[type=submit]').forEach(b=>b.disabled=true);const s=app.session;try{const data=await api({op,code:s.code,actionId:uuid(),roundId:app.room?.round?.id??null,turnSequence:app.room?.round?.turnSequence,...extra},s.token);if(app.session?.token!==s.token)return null;if(op==='leave'){clearSession();return data;}accept(data);return data;}catch(e){toast(e.message);poll();return null;}finally{app.busy=false;if(app.session)render();}}
function clearSession(){if(app.session){store.remove('gaon_session_'+app.session.code);if(store.get('gaon_current')===app.session.code)store.remove('gaon_current');}app.session=null;app.room=null;app.local=false;app.localRoom=null;app.gateSeat=null;app.renderKey='';app.secret=false;app.mission=false;clearTimeout(pollTimer);$('#connection').innerHTML='';const url=new URL(location.href);url.searchParams.delete('room');try{window.history.replaceState(null,'',url)}catch{};render();}
async function resume(code){try{const saved=JSON.parse(store.get('gaon_session_'+code)||'null');if(!saved?.token){modalOpen('join',{code});return;}app.session=saved;const data=await api(null,saved.token,'GET',code);accept(data);schedulePoll();}catch(e){clearSession();toast(e.message);}}
function inviteUrl(){return APP_ORIGIN+location.pathname+'?room='+app.room.code;}
async function copyText(value){try{await navigator.clipboard.writeText(value);return true;}catch{try{const input=document.createElement('textarea');input.value=value;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();return ok;}catch{return false;}}}
function updateTimers(){document.querySelectorAll('[data-deadline]').forEach(el=>{const sec=Math.max(0,Math.ceil((Number(el.dataset.deadline)-now())/1000));if(el.textContent!==String(sec)){el.textContent=String(sec);if(sec===0&&app.session)schedulePoll(30);}el.closest('[data-timer-pill]')?.classList.toggle('urgent',sec<=5);});document.querySelectorAll('[data-tenths]').forEach(el=>el.textContent=Math.max(0,(Number(el.dataset.tenths)-now())/1000).toFixed(1));document.querySelectorAll('[data-start]').forEach(el=>{const sec=Math.ceil((Number(el.dataset.start)-now())/1000);const label=sec>0?String(sec):'시작!';if(el.textContent!==label){el.textContent=label;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}});}
let audioCtx;function tone(kind='tap'){if(!app.sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes=kind==='result'?[523,659,784]:[600];notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.07,audioCtx.currentTime+i*.11);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+i*.11+.2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+i*.11);osc.stop(audioCtx.currentTime+i*.11+.22);});}catch{}}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const el=document.createElement('div');el.className='confetti';el.setAttribute('aria-hidden','true');const colors=['#e9a28e','#d2bbdf','#e8cc77','#b3c4a4','#a6c3cc'];el.innerHTML=Array.from({length:24},(_,i)=>'<i style="--x:'+(i*4.3)+'%;--c:'+colors[i%5]+';--d:'+(i%7*.07)+'s"></i>').join('');document.body.append(el);setTimeout(()=>el.remove(),3200);}

window.addEventListener('online',()=>{if(app.session)poll();});
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='share-url')e.target.select();});
function init(){render();const intro=$('#intro');intro.innerHTML='<div><div class="intro-kicker">A LITTLE JOY, TOGETHER</div>'+gaon(true)+'<div class="intro-line"></div><p class="intro-foot">가온연구소 제작 · 함께 웃는 시간을 만듭니다.</p></div><button class="skip" id="skip-intro">바로 시작 '+iconInline('arrow')+'</button>';let seen=false;try{seen=sessionStorage.getItem('gaon_intro')==='yes';sessionStorage.setItem('gaon_intro','yes')}catch{}const dismiss=()=>{intro.classList.add('fade');setTimeout(()=>intro.remove(),450);};$('#skip-intro').addEventListener('click',dismiss);if(seen)intro.remove();else setTimeout(dismiss,2600);const code=new URL(location.href).searchParams.get('room')?.toUpperCase();if(code&&/^[A-Z2-9]{6}$/.test(code)){if(store.get('gaon_session_'+code))resume(code);else setTimeout(()=>modalOpen('join',{code}),seen?100:2800);}setInterval(updateTimers,100);}
init();
</script>
</body>
